name: OCI ARM Instance Forge

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OCI SDK
        run: |
          pip install oci

      - name: Run Auto Launch Script
        run: |
          cat << 'EOF' > launch.py
          import os
          import oci

          # 写入私钥
          private_key = os.environ.get("OCI_PRIVATE_KEY", "")
          with open("/tmp/oci_api_key.pem", "w") as f:
              f.write(private_key)

          config = {
              "user": os.environ.get("OCI_USER_ID"),
              "key_file": "/tmp/oci_api_key.pem",
              "fingerprint": os.environ.get("OCI_KEY_FINGERPRINT"),
              "tenancy": os.environ.get("OCI_TENANCY_ID"),
              "region": os.environ.get("OCI_REGION")
          }

          compute_client = oci.core.ComputeClient(config)

          # 读取并清洗环境变量
          shape = "VM.Standard.A1.Flex"
          ocpus = float(os.environ.get("OCI_OCPUS", "4"))
          memory_in_gbs = float(os.environ.get("OCI_MEMORY_IN_GBS", "24"))
          ad = (os.environ.get("OCI_AVAILABILITY_DOMAIN") or "").strip()
          compartment_id = (os.environ.get("OCI_TENANCY_ID") or "").strip()
          subnet_id = (os.environ.get("OCI_SUBNET_ID") or "").strip()
          boot_volume_id = (os.environ.get("OCI_BOOT_VOLUME_ID") or "").strip()

          # 构造 VNIC 与引导卷挂载参数
          vnic_details = oci.core.models.CreateVnicDetails(
              subnet_id=subnet_id,
              assign_public_ip=True
          )

          source_details = oci.core.models.InstanceSourceViaBootVolumeDetails(
              boot_volume_id=boot_volume_id
          )

          # 构造标准请求（包含 Flex 规格配置）
          launch_details = oci.core.models.LaunchInstanceDetails(
              compartment_id=compartment_id,
              availability_domain=ad,
              shape=shape,
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                  ocpus=ocpus,
                  memory_in_gbs=memory_in_gbs
              ),
              create_vnic_details=vnic_details,
              source_details=source_details
          )

          try:
              print("Sending request to Oracle Cloud API...")
              response = compute_client.launch_instance(launch_details)
              print(" SUCCESS! Instance created successfully!")
              print(f"Instance OCID: {response.data.id}")
          except oci.exceptions.ServiceError as e:
              if e.status == 500 or "Out of host capacity" in str(e.message):
                  print(" Out of host capacity (Capacity full, will retry next run).")
              elif e.status == 429 or "TooManyRequests" in str(e.code):
                  print(" Too Many Requests (API Rate Limit hit, will retry next run).")
              else:
                  print(f" OCI Service Error [{e.status}]: {e.code} - {e.message}")
          except Exception as e:
              print(f" Unexpected Error: {str(e)}")
          EOF

          python launch.py
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
