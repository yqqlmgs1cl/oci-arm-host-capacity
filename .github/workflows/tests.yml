name: OCI ARM Instance Forge

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI & Launch
        run: |
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config

          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True

          # 构造标准的 API REST Request Body
          cat << EOF > /tmp/launch_payload.json
          {
            "compartmentId": "${{ secrets.OCI_TENANCY_OCID }}",
            "availabilityDomain": "${{ secrets.OCI_AVAILABILITY_DOMAIN }}",
            "shape": "VM.Standard.A1.Flex",
            "shapeConfig": {
              "ocpus": 2.0,
              "memoryInGBs": 12.0
            },
            "createVnicDetails": {
              "subnetId": "${{ secrets.OCI_SUBNET_ID }}",
              "assignPublicIp": true
            },
            "sourceDetails": {
              "sourceType": "bootVolume",
              "bootVolumeId": "${{ secrets.OCI_BOOT_VOLUME_ID }}"
            }
          }
          EOF

          echo "Sending raw REST Payload via OCI CLI..."
          
          # 使用 --from-json 发送结构化 Body
          oci compute instance launch --from-json file:///tmp/launch_payload.json > /tmp/oci_res.json 2>&1 || true

          # 解析运行结果
          if grep -q "Out of host capacity" /tmp/oci_res.json; then
            echo " Out of host capacity (Capacity full, will retry next run)."
          elif grep -q "TooManyRequests" /tmp/oci_res.json; then
            echo " Too Many Requests (Rate limit, will retry next run)."
          elif grep -q '"id": "ocid1.instance' /tmp/oci_res.json; then
            echo " SUCCESS! Instance created successfully!"
            cat /tmp/oci_res.json
          else
            echo " OCI CLI Output:"
            cat /tmp/oci_res.json
          fi
