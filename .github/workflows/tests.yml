name: OCI ARM Instance Forge

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI & Launch
        run: |
          mkdir -p ~/.oci
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

          echo "Sending request via OCI CLI..."
          
          # 使用 OCI CLI 发起开机请求
          oci compute instance launch \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --availability-domain "${{ secrets.OCI_AVAILABILITY_DOMAIN }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": '${{ secrets.OCI_OCPUS }}', "memory_in_gbs": '${{ secrets.OCI_MEMORY_IN_GBS }}'}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --source-boot-volume-id "${{ secrets.OCI_BOOT_VOLUME_ID }}" \
            --assign-public-ip true > /tmp/oci_res.json 2>&1 || true

          # 解析运行结果
          if grep -q "Out of host capacity" /tmp/oci_res.json; then
            echo " Out of host capacity (Capacity full, will retry next run)."
          elif grep -q "TooManyRequests" /tmp/oci_res.json; then
            echo " Too Many Requests (Rate limit, will retry next run)."
          elif grep -q '"id": "ocid1.instance' /tmp/oci_res.json; then
            echo " SUCCESS! Instance created successfully!"
            cat /tmp/oci_res.json
          else
            echo " OCI CLI Result:"
            cat /tmp/oci_res.json
          fi
