name: OCI ARM Instance Forge

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟一次，尽量避开整点（:00 和 :30）
    - cron: '7,37 * * * *'

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCI SDK
        run: pip install oci

      - name: Run OCI Launch Loop
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
        run: |
          mkdir -p ~/.oci

          # 写入 config
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          EOF

          # 写入私钥
          echo "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

          cat > launch.py << 'EOF'
          import oci
          import time
          import os
          import sys

          config = oci.config.from_file("~/.oci/config", "DEFAULT")
          compute_client = oci.core.ComputeClient(config)

          compartment_id = os.environ['COMPARTMENT_ID']
          ad = os.environ['AVAILABILITY_DOMAIN']
          subnet_id = os.environ['SUBNET_ID']
          boot_volume_id = os.environ['BOOT_VOLUME_ID']

          instance_details = oci.core.models.LaunchInstanceDetails(
              compartment_id=compartment_id,
              availability_domain=ad,
              shape="VM.Standard.A1.Flex",
              shape_config=oci.core.models.LaunchInstanceShapeConfigDetails(
                  ocpus=1,
                  memory_in_gbs=6
              ),
              source_details=oci.core.models.InstanceSourceViaBootVolumeDetails(
                  source_type="bootVolume",
                  boot_volume_id=boot_volume_id
              ),
              create_vnic_details=oci.core.models.CreateVnicDetails(
                  subnet_id=subnet_id,
                  assign_public_ip=True
              ),
              display_name=f"arm-revive-{int(time.time())}"
          )

          for i in range(10):
              print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] 尝试第 {i+1}/10 次...")
              try:
                  response = compute_client.launch_instance(instance_details)
                  print("✅ SUCCESS! 实例创建成功！")
                  print(f"Instance ID: {response.data.id}")
                  sys.exit(0)
              except oci.exceptions.ServiceError as e:
                  msg = str(e.message) if hasattr(e, 'message') else str(e)
                  if "Out of host capacity" in msg or e.status == 500:
                      print("❌ Out of host capacity（容量已满）")
                  elif e.status == 429:
                      print("⚠️ Too Many Requests（触发限流）")
                  else:
                      print(f"❓ Error {e.status}: {e.code} - {msg}")
              except Exception as e:
                  print(f"❓ 未知异常: {str(e)}")

              if i < 9:
                  time.sleep(20)

          print("本轮 10 次尝试全部失败，等待下次定时任务")
          EOF

          python launch.py
