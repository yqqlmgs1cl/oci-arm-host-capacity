name: OCI ARM Instance Forge

on:
  workflow_dispatch:          # 支持手动触发
  schedule:
    - cron: '*/15 * * * *'    # 每 15 分钟跑一次（比 10 分钟更稳，减少 429）

jobs:
  run-oci-script:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Configure OCI CLI & Launch Instance
        run: |
          set -e

          mkdir -p ~/.oci

          # 使用 <<-EOF 去掉缩进，保证 config 和私钥格式正确
          cat <<-EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF

          cat <<-EOF > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem

          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True

          echo "========================================"
          echo "开始尝试启动 ARM 实例 (使用原有 Boot Volume)"
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================"

          # 启动实例（去掉 --debug，减少日志干扰）
          # 使用 1 OCPU + 6GB 更容易抢到容量
          oci compute instance launch \
            --compartment-id "${{ secrets.OCI_TENANCY_OCID }}" \
            --availability-domain "${{ secrets.OCI_AVAILABILITY_DOMAIN }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":1,"memoryInGBs":6}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --source-details '{"sourceType":"bootVolume","bootVolumeId":"'${{ secrets.OCI_BOOT_VOLUME_ID }}'"}' \
            --assign-public-ip true \
            --display-name "arm-revive-$(date +%Y%m%d-%H%M%S)" \
            > /tmp/oci_res.json 2>&1 || true

          # 结果判断
          if grep -q "Out of host capacity" /tmp/oci_res.json; then
            echo "❌ Out of host capacity（容量已满，下次继续重试）"
          elif grep -q "TooManyRequests\|429" /tmp/oci_res.json; then
            echo "⚠️  Too Many Requests（触发限流，下次继续重试）"
          elif grep -q '"id": "ocid1.instance' /tmp/oci_res.json; then
            echo "✅ SUCCESS! 实例创建成功！"
            echo "----------------------------------------"
            cat /tmp/oci_res.json
            echo "----------------------------------------"
          else
            echo "❓ 未知错误，完整输出如下："
            cat /tmp/oci_res.json
          fi
